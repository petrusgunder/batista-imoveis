{% extends "base.html" %}

{% block titulo %}Editar imóvel — Batista Imóveis{% endblock %}

{% block conteudo %}
<section class="auth">
    <form class="auth-card" action="{{ url_for('public.editar_imovel', id=imovel.id) }}" method="POST">
        <h1>Editar imóvel</h1>

        <div class="campo">
            <label for="nome">Nome do imóvel</label>
            <input type="text" id="nome" name="nome" value="{{ imovel.nome }}" required>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="4" required>{{ imovel.descricao }}</textarea>
        </div>

        <div class="campo">
            <label for="preco">Preço</label>
            <input type="number" id="preco" name="preco" min="0" step="0.01" value="{{ imovel.preco }}" required>
        </div>

        <div class="campo">
            <label for="localizacao">Localização</label>
            <input type="text" id="localizacao" name="localizacao" value="{{ imovel.localizacao }}" required>
        </div>

        <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo" required>
                <option value="casa" {% if imovel.tipo == 'casa' %}selected{% endif %}>Casa</option>
                <option value="apartamento" {% if imovel.tipo == 'apartamento' %}selected{% endif %}>Apartamento</option>
                <option value="kitnet" {% if imovel.tipo == 'kitnet' %}selected{% endif %}>Kitnet</option>
            </select>
        </div>

        <div class="campo">
            <label for="finalidade">Finalidade</label>
            <select id="finalidade" name="finalidade" required>
                <option value="venda" {% if imovel.finalidade == 'venda' %}selected{% endif %}>Venda</option>
                <option value="aluguel" {% if imovel.finalidade == 'aluguel' %}selected{% endif %}>Aluguel</option>
            </select>
        </div>

        <div class="campo">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="disponivel" {% if imovel.status == 'disponivel' %}selected{% endif %}>Disponível</option>
                <option value="vendido" {% if imovel.status == 'vendido' %}selected{% endif %}>Vendido</option>
                <option value="alugado" {% if imovel.status == 'alugado' %}selected{% endif %}>Alugado</option>
            </select>
        </div>

        <div class="campo">
            <label for="quartos">Quartos</label>
            <input type="number" id="quartos" name="quartos" min="0" value="{{ imovel.quartos }}" required>
        </div>

        <div class="campo">
            <label for="banheiros">Banheiros</label>
            <input type="number" id="banheiros" name="banheiros" min="0" value="{{ imovel.banheiros }}" required>
        </div>

        <div class="campo">
            <label for="area">Área (m²)</label>
            <input type="number" id="area" name="area" min="0" step="0.01" value="{{ imovel.area }}" required>
        </div>

        <button type="submit">Salvar alterações</button>
    </form>
</section>
{% endblock %}
