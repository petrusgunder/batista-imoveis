{% extends "base.html" %}

{% block titulo %}Entrar — Batista Imóveis{% endblock %}

{% block conteudo %}
<section class="auth">
    <form class="auth-card" action="#" method="POST">
        <h1>Entrar</h1>
        <p class="auth-sub">Acesse seus favoritos e seu histórico de buscas.</p>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" required>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
        </div>

        <button type="submit">Entrar</button>

        <p class="auth-alt">Ainda não tem conta? <a href="{{ url_for('public.cadastro') }}">Criar conta</a></p>
    </form>
</section>
{% endblock %}
