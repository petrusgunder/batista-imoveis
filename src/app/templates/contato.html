{% extends "base.html" %}

{% block titulo %}Contatos — Batista Imóveis{% endblock %}

{% block conteudo %}
<section class="auth">
    <form class="auth-card" action="#" method="POST">
        <h1>Fale conosco</h1>
        <p class="auth-sub">Dúvidas, sugestões ou problemas com o site.</p>

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" required>
        </div>

        <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem" required></textarea>
        </div>

        <button type="submit">Enviar</button>
    </form>
</section>
{% endblock %}
