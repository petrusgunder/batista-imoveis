{% extends "base.html" %}

{% block titulo %}Novo imóvel — JB Imóveis{% endblock %}

{% block conteudo %}
<section class="auth">
    <form class="auth-card" action="{{ url_for('public.novo_imovel') }}" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1>Novo imóvel</h1>

        <div class="campo">
            <label for="nome">Nome do imóvel</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Casa no centro" required>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="4" required></textarea>
        </div>

        <div class="campo">
            <label for="preco">Preço</label>
            <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="R$ 0,00" required>
        </div>

        <div class="campo">
            <label for="localizacao">Localização</label>
            <input type="text" id="localizacao" name="localizacao" placeholder="Bairro, cidade" required>
        </div>

        <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo" required>
                <option value="casa">Casa</option>
                <option value="apartamento">Apartamento</option>
                <option value="kitnet">Kitnet</option>
            </select>
        </div>

        <div class="campo">
            <label for="finalidade">Finalidade</label>
            <select id="finalidade" name="finalidade" required>
                <option value="venda">Venda</option>
                <option value="aluguel">Aluguel</option>
            </select>
        </div>

        <div class="campo">
            <label for="quartos">Quartos</label>
            <input type="number" id="quartos" name="quartos" min="0" required>
        </div>

        <div class="campo">
            <label for="banheiros">Banheiros</label>
            <input type="number" id="banheiros" name="banheiros" min="0" required>
        </div>

        <div class="campo">
            <label for="area">Área (m²)</label>
            <input type="number" id="area" name="area" min="0" step="0.01" required>
        </div>

        <div class="campo">
            <label for="fotos">Fotos do imóvel</label>
            <div id="linhas-fotos"></div>
            <button type="button" id="btn-adicionar-foto" class="btn-adicionar-foto">＋ Adicionar foto</button>
            <p class="campo-ajuda">Clique em "Adicionar foto" para cada foto extra. Em cada campo você também pode selecionar várias de uma vez segurando Ctrl (ou Cmd no Mac).</p>
        </div>

        <button type="submit">Cadastrar imóvel</button>
    </form>
</section>

<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
