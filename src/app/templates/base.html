<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Batista Imóveis{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="logo">
            <a href="{{ url_for('public.home') }}">Batista <span>Imóveis</span></a>
        </div>
        <nav class="pesquisa">
            <a href="{{ url_for('public.home') }}">Início</a>
            <a href="{{ url_for('public.cadastro') }}">Cadastro</a>
            <a href="#">Sobre</a>
        </nav>
    </header>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Batista Imóveis</p>
    </footer>

</body>
</html>
