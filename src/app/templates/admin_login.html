{% extends "base.html" %}

{% block titulo %}Login ADM — Batista Imóveis{% endblock %}

{% block conteudo %}
<section class="auth">
    <form class="auth-card" action="{{ url_for('auth.login') }}" method="POST">
        <h1>Área administrativa</h1>
        <p class="auth-sub">Acesso restrito ao administrador do site.</p>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" required>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
        </div>

        <button type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
